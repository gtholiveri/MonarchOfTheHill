; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Motor driver for this environment comes from DRIVE_BACKEND in src/config.h.

; Same firmware, but never runs the strategy: prints sensor values and drives
; from the serial monitor. Use it for the first bring-up (checklist in main.cpp).
[env:esp32dev_bench]
extends = env:esp32dev
build_flags = -DBENCH_MODE

; Same two environments for the SparkFun Qwiic (I2C) motor driver, which needs
; its own library. Use these instead if that is the board on the robot.
[env:qwiic]
extends = env:esp32dev
build_flags = -DDRIVE_BACKEND=DRIVE_QWIIC_SCMD
lib_deps =
	sparkfun/Serial Controlled Motor Driver@^1.0.4

[env:qwiic_bench]
extends = env:qwiic
build_flags = -DDRIVE_BACKEND=DRIVE_QWIIC_SCMD -DBENCH_MODE

; Runs the unit tests on this PC against a simulated robot and hill:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11
