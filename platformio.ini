; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Same firmware, but never runs the strategy: prints sensor values and drives
; from the serial monitor. Use it for the first bring-up (checklist in main.cpp).
[env:esp32dev_bench]
extends = env:esp32dev
build_flags = -DBENCH_MODE

; Runs the unit tests on this PC against a simulated robot and hill:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11
